name: Deploy to Environments

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    name: Validate Staging Deployment
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    env:
      STAGING_SQL_SERVER: localhost
      STAGING_SQL_DATABASE: AdventureWorks2014
      STAGING_SQL_USER: sa

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC Driver 17
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql17 unixodbc

      - name: Install dependencies
        run: python -m pip install -r dbt/requirements.txt

      # This runner is discarded after the job; this validates deployment without a persistent staging server.
      - name: Start temporary staging database
        run: |
          staging_password="$(openssl rand -hex 24)A!"
          echo "::add-mask::$staging_password"
          echo "SQLSERVER_SA_PASSWORD=$staging_password" >> "$GITHUB_ENV"
          echo "STAGING_SQL_PASSWORD=$staging_password" >> "$GITHUB_ENV"
          SQLSERVER_SA_PASSWORD="$staging_password" docker compose up -d --build sqlserver

      - name: Restore AdventureWorks sample data
        run: docker compose exec -T sqlserver /tmp/restore_db.sh

      - name: Run deployment
        env:
          SKIP_PRE_DEPLOY_TESTS: '1'
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh staging staging

      - name: Run smoke tests
        run: |
          python scripts/smoke_tests.py \
            --server "$STAGING_SQL_SERVER" \
            --database "$STAGING_SQL_DATABASE" \
            --user "$STAGING_SQL_USER" \
            --password "$STAGING_SQL_PASSWORD"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment
          path: |
            dbt/target/
            backups/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    needs: []

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC Driver 17
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql17 unixodbc

      - name: Install dependencies
        run: python -m pip install -r dbt/requirements.txt

      - name: Run deployment
        env:
          PROD_SQL_SERVER: ${{ secrets.PROD_SQL_SERVER }}
          PROD_SQL_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh production prod

      - name: Run smoke tests
        run: |
          python scripts/smoke_tests.py \
            --server ${{ secrets.PROD_SQL_SERVER }} \
            --database AdventureWorks2014_Prod \
            --user ${{ secrets.PROD_SQL_USER }} \
            --password ${{ secrets.PROD_SQL_PASSWORD }}

      - name: Notify team
        if: always()
        run: |
          echo "Deployment to production completed"
          # Add Slack notification here
