name: Deploy to Environments

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Validate Staging Deployment
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event.inputs.environment == 'staging')
    environment: staging
    env:
      STAGING_SQL_SERVER: localhost
      STAGING_SQL_DATABASE: AdventureWorks2014
      STAGING_SQL_USER: sa

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC Driver 17
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql17 unixodbc

      - name: Install dependencies
        run: python -m pip install -r dbt/requirements.txt

      # This runner is discarded after the job; this validates deployment without a persistent staging server.
      - name: Start temporary staging database
        run: |
          staging_password="$(openssl rand -hex 24)A!"
          echo "::add-mask::$staging_password"
          echo "SQLSERVER_SA_PASSWORD=$staging_password" >> "$GITHUB_ENV"
          echo "STAGING_SQL_PASSWORD=$staging_password" >> "$GITHUB_ENV"
          SQLSERVER_SA_PASSWORD="$staging_password" docker compose up -d --build sqlserver

      - name: Restore AdventureWorks sample data
        run: docker compose exec -T sqlserver /tmp/restore_db.sh

      - name: Run deployment and smoke tests
        env:
          SKIP_PRE_DEPLOY_TESTS: '1'
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh staging staging

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment
          if-no-files-found: warn
          path: |
            dbt/target/
            backups/

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.environment == 'production')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC Driver 17
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql17 unixodbc

      - name: Install dependencies
        run: python -m pip install -r dbt/requirements.txt

      - name: Run deployment and smoke tests
        env:
          PROD_SQL_SERVER: ${{ secrets.PROD_SQL_SERVER }}
          PROD_SQL_USER: ${{ secrets.PROD_SQL_USER }}
          PROD_SQL_PASSWORD: ${{ secrets.PROD_SQL_PASSWORD }}
        run: |
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh production prod

      - name: Upload release snapshot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-release
          path: backups/production_*/
          if-no-files-found: error
