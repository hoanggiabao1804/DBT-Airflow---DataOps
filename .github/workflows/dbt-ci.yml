name: DBT CI Pipeline

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  lint-sql:
    name: Lint SQL Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQLFluff
        run: python -m pip install sqlfluff

      - name: Lint SQL files
        run: |
          cd dbt
          sqlfluff lint models/ --dialect tsql

  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python files
        run: flake8 airflow/dags/ --max-line-length=120 --count --statistics

  dbt-compile:
    name: Run DBT Models and Tests
    runs-on: ubuntu-24.04
    env:
      DBT_CI_DATABASE: AdventureWorks2014

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install SQL Server ODBC Driver 17
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo env ACCEPT_EULA=Y DEBIAN_FRONTEND=noninteractive apt-get install -y msodbcsql17 unixodbc

      - name: Install DBT
        run: python -m pip install -r dbt/requirements.txt

      - name: Start temporary CI database
        run: |
          ci_password="$(openssl rand -hex 24)A!"
          echo "::add-mask::$ci_password"
          echo "SQLSERVER_SA_PASSWORD=$ci_password" >> "$GITHUB_ENV"
          echo "DBT_CI_PASSWORD=$ci_password" >> "$GITHUB_ENV"
          SQLSERVER_SA_PASSWORD="$ci_password" docker compose up -d --build sqlserver

      - name: Restore AdventureWorks sample data
        run: docker compose exec -T sqlserver /tmp/restore_db.sh

      - name: Install DBT dependencies
        run: |
          cd dbt
          dbt deps --profiles-dir . --target ci

      - name: Compile DBT models
        run: |
          cd dbt
          dbt compile --profiles-dir . --target ci

      - name: Run DBT models
        run: |
          cd dbt
          dbt run --profiles-dir . --target ci

      - name: Test DBT models
        run: |
          cd dbt
          dbt test --profiles-dir . --target ci

      - name: Generate DBT documentation
        run: |
          cd dbt
          dbt docs generate --profiles-dir . --target ci

      - name: Upload compiled artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-compiled
          path: dbt/target/
          retention-days: 7
