version: 2

models:
  - name: gld_customer_metrics
    description: >-
      One row per Silver customer, including customers with no orders. Counts are
      zero for those customers; revenue, AOV, item totals and order dates remain
      NULL. Revenue excludes tax and freight.
    columns:
      - name: customer_id
        description: Customer dimension key.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('slvr_customers')
              field: customer_id
      - name: full_name
        description: Normalized customer name from Silver.
      - name: territory_id
        description: Optional sales territory identifier.
      - name: total_orders
        description: Count of distinct order identifiers; zero for customers with no orders.
        data_tests: [not_null, positive_values]
      - name: total_revenue
        description: Sum of net line revenue; NULL when the customer has no orders.
        data_tests: [positive_values]
      - name: avg_order_value
        description: Total net line revenue divided by distinct orders; NULL with no orders.
        data_tests: [positive_values]
      - name: total_items_purchased
        description: Sum of quantities; NULL with no orders, otherwise strictly positive.
        data_tests:
          - positive_values:
              allow_zero: false
      - name: first_order_date
        description: First order timestamp, interpreted as UTC; NULL with no orders.
        data_tests: [no_future_dates]
      - name: last_order_date
        description: Last order timestamp, interpreted as UTC; NULL with no orders.
        data_tests: [no_future_dates]
      - name: orders_with_discount
        description: Distinct orders with at least one discounted line, not a count of lines.
        data_tests: [not_null, positive_values]

  - name: gld_product_performance
    description: >-
      One row per Silver product, including products with no sales. Order count
      and margin are zero with no sales; quantity, revenue, selling price and
      profit remain NULL. A sold product with zero revenue has NULL margin.
    columns:
      - name: product_id
        description: Product dimension key.
        data_tests:
          - not_null
          - unique
          - relationships:
              to: ref('slvr_products')
              field: product_id
      - name: product_name
        description: Product name from Silver.
      - name: subcategory_name
        description: Subcategory name, including Uncategorized for missing categories.
      - name: color
        description: Product color from Silver.
      - name: list_price
        description: Current product list price; zero is valid.
        data_tests: [not_null, positive_values]
      - name: standard_cost
        description: Current product unit cost used for the estimated profit calculation.
        data_tests: [not_null, positive_values]
      - name: total_orders
        description: Distinct orders containing the product; zero for products with no sales.
        data_tests: [not_null, positive_values]
      - name: total_quantity_sold
        description: Quantity sold; NULL with no sales, otherwise strictly positive.
        data_tests:
          - positive_values:
              allow_zero: false
      - name: total_revenue
        description: Sum of net line revenue; NULL for products with no sales.
        data_tests: [positive_values]
      - name: avg_selling_price
        description: Unweighted mean of pre-discount unit prices per line; NULL with no sales.
        data_tests: [positive_values]
      - name: total_profit
        description: Revenue minus sold quantity times current standard cost; may be negative or NULL.
      - name: profit_margin_pct
        description: >-
          Estimated profit divided by revenue times 100. May be negative;
          NULL for sold products with zero revenue, zero for products with no sales.

  - name: gld_sales_summary
    description: One row per order date. Counts use orders, while avg_order_line_value uses sales lines.
    columns:
      - name: order_date
        description: Order date, cast from the order timestamp.
        data_tests: [not_null, unique, no_future_dates]
      - name: total_orders
        description: Distinct orders placed on the date; strictly positive for an existing date row.
        data_tests:
          - not_null
          - positive_values:
              allow_zero: false
      - name: unique_customers
        description: Distinct customers who ordered on the date.
        data_tests:
          - not_null
          - positive_values:
              allow_zero: false
      - name: total_items_sold
        description: Sum of quantities across sales lines on the date.
        data_tests:
          - not_null
          - positive_values:
              allow_zero: false
      - name: total_revenue
        description: Sum of net line revenue excluding tax and freight; may be zero.
        data_tests: [not_null, positive_values]
      - name: avg_order_line_value
        description: Average net revenue per sales line, not average order value.
        data_tests: [not_null, positive_values]
      - name: online_orders
        description: Distinct orders placed through the Online channel.
        data_tests: [not_null, positive_values]
      - name: offline_orders
        description: Distinct orders placed through the Offline channel.
        data_tests: [not_null, positive_values]
      - name: discounted_revenue
        description: Net revenue from lines with a discount; zero if no lines are discounted.
        data_tests: [not_null, positive_values]
