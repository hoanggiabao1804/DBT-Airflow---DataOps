      - name: SalesOrderHeader
        description: Legacy dbo.SalesOrderHeader declaration; unused by the current model lineage and not validated.
      - name: SalesOrderDetail
        description: Legacy dbo.SalesOrderDetail declaration; unused by the current model lineage and not validated.
      - name: Product
        description: Legacy dbo.Product declaration; unused by the current model lineage and not validated.
